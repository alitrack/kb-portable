<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>KB 便携包 × duckdb-web(1.33 wasm)</title>
<style>
body{font:13px/1.55 system-ui,-apple-system,"PingFang SC",sans-serif;margin:24px;max-width:980px;color:#16211e}
h1{font-size:19px}
h2{font-size:15px;margin-top:18px}
#ver{display:inline-block;background:#e8f3ec;border:1px solid #bfe0cd;padding:2px 8px;border-radius:6px;font-weight:600}
pre{background:#f4f7f5;border:1px solid #dde6e1;border-radius:8px;padding:10px 12px;overflow:auto;max-height:430px;white-space:pre-wrap}
.row{display:flex;gap:10px;align-items:center;margin:12px 0;flex-wrap:wrap}
button{background:#1d7a4f;color:#fff;border:0;border-radius:7px;padding:7px 14px;cursor:pointer}
button:hover{background:#175f3e}
button.jev{background:#7a4fcf}
button.jev:hover{background:#5f3ea5}
.note{color:#5a6b63;font-size:12px}
.ok{color:#1d7a4f;font-weight:600}.err{color:#b03030;font-weight:600}.warn{color:#b07a20;font-weight:600}
input[type=text]{flex:1;min-width:260px;padding:6px 10px;border:1px solid #c9d6cf;border-radius:7px}
</style>
</head>
<body>
<h1>KB 便携包 × duckdb-web · 数据源 = .duckdb 文件本身</h1>
<p>引擎: <span id="ver">…</span>
<span class="note">静态: 引擎自包含(本地 bundle+wasm);动态: JEV 经同源 /jev 代理(免 CORS)</span></p>
<div class="row">
  <input type="file" id="file" accept=".duckdb">
  <button id="load">载入 .duckdb</button>
  <button id="autoload">演示: 直接载入 /kb.duckdb</button>
  <button id="go">① 静态查询链</button>
</div>
<pre id="out">等待操作…</pre>

<h2>② 可选动态层: JEV 证据裁判(SAG2, 查询期 LLM)</h2>
<div class="row">
  <input type="text" id="question" value="GraphRAG 是怎么改进检索的?">
  <button class="jev" id="jevgo">跑 JEV(种子判分→词扩展二跳)</button>
</div>
<pre id="jevout">JEV 层结果会显示在这里(端点不可达时自动降级纯静态, 如实标注 degraded)。</pre>

<script type="module">
// 相对路径: GitHub Pages(站点在 /<repo>/ 子路径)和本地 serve(根下)都成立
import * as duckdb from './duckdb-wasm/duckdb-web-bundle.mjs';

const out = document.getElementById('out');
const log = (el, t, cls) => {
  const span = document.createElement('span');
  if (cls) span.className = cls;
  span.textContent = t + '\n';
  el.appendChild(span);
  el.scrollTop = el.scrollHeight;
};
let conn = null;
let dbReady = false;

// ---------- 引擎: 1.33 Statically Served 模式 ----------
// 只声明 mvp: selectBundle 会预热全部声明的 bundle, eh(重负载)不入库则会导致 404 拖死实例化
const MANUAL_BUNDLES = {
  // mainWorker 相对页面 URL; mainModule 相对 worker 自身 URL(worker 与 wasm 同目录)
  mvp: { mainModule: 'duckdb-mvp.wasm', mainWorker: './duckdb-wasm/duckdb-browser-mvp.worker.js' },
};
const bundle = await duckdb.selectBundle(MANUAL_BUNDLES);
const worker = new Worker(bundle.mainWorker);
const db = new duckdb.AsyncDuckDB(new duckdb.ConsoleLogger(), worker);
await db.instantiate(bundle.mainModule, bundle.pthreadWorker);
document.getElementById('ver').textContent = 'duckdb-wasm ' + (await db.getVersion());
log(out, '引擎实例化完成: ' + (await db.getVersion()) + '(1.x 线, 与 duckdb-web 同代)', 'ok');

// ---------- 结果读取(arrow 17 Table) ----------
async function q(sql) {
  const t = await conn.query(sql);
  const names = t.schema.names;
  const n = t.numRows;
  const rows = [];
  for (let i = 0; i < n; i++) {
    const row = [];
    for (let j = 0; j < names.length; j++) {
      let v = t.getChildAt(j).get(i);
      if (typeof v === 'bigint') v = Number(v);
      if (Array.isArray(v)) v = v.map(x => typeof x === 'bigint' ? Number(x) : x);
      row.push(v);
    }
    rows.push(row);
  }
  return rows;
}

// ---------- 载入 .duckdb 文件 = 数据源 ----------
async function loadFile(file) {
  if (conn) { try { await conn.close(); } catch(_) {} conn = null; }
  const buf = await file.arrayBuffer();
  await db.registerFileBuffer('/kb.duckdb', new Uint8Array(buf));
  await db.open({ path: '/kb.duckdb' });
  conn = await db.connect();
  dbReady = true;
  return (buf.byteLength / 1024).toFixed(0) + ' KB';
}
document.getElementById('load').onclick = async () => {
  const f = document.getElementById('file').files[0];
  if (!f) return log(out, '请先选择 .duckdb 文件', 'err');
  try { const kb = await loadFile(f); log(out, `已载入 ${f.name} (${kb}) -> /kb.duckdb`, 'ok'); }
  catch (e) { log(out, 'OPEN FAIL: ' + e.message, 'err'); }
};
document.getElementById('autoload').onclick = async () => {
  try {
    const r = await fetch('kb.duckdb');   // 相对路径: Pages(/kb-portable/ 子路径)与本地(根)都解析正确
    const buf = await r.arrayBuffer();
    await db.registerFileBuffer('/kb.duckdb', new Uint8Array(buf));
    if (conn) { try { await conn.close(); } catch(_) {} }
    await db.open({ path: '/kb.duckdb' });
    conn = await db.connect();
    dbReady = true;
    log(out, `已载入 /kb.duckdb (${(buf.byteLength/1024).toFixed(0)} KB) —— 便携包本体直接做数据源`, 'ok');
  } catch (e) { log(out, 'OPEN FAIL: ' + e.message, 'err'); }
};

// ---------- ① 静态查询链(纯 SQL, 索引期产物, 查询期零模型) ----------
async function runStatic() {
  if (!dbReady) return log(out, '请先载入 .duckdb 文件', 'err');
  out.innerHTML = '';
  const t0 = performance.now();
  try {
    const counts = await q('SELECT (SELECT count(*) FROM chunks) c, (SELECT count(*) FROM nodes) n, (SELECT count(*) FROM edges) e, (SELECT count(*) FROM meta) m');
    log(out, '表行数 chunks/nodes/edges/meta: ' + JSON.stringify(counts[0]), 'ok');

    const seed = await q(`
      WITH q AS (SELECT [0.85, 0.15, 0.0, 0.15]::FLOAT[4] v),
      parts AS (SELECT c.id, c.text,
               (SELECT sum((q.v[i] - c.embedding[i]) * (q.v[i] - c.embedding[i])) FROM unnest(range(0,4)) t(i)) d2
        FROM chunks c, q)
      SELECT id, text, sqrt(d2) d FROM parts ORDER BY d LIMIT 3`);
    log(out, '\n① 向量种子(纯 SQL L2, 无 vss 依赖):\n' +
        seed.map(r => `   ${r[0]} d=${(+r[2]).toFixed(3)}  ${String(r[1]).slice(0,44)}`).join('\n'), 'ok');

    const graph = await q('SELECT e.source_id, e.relation, e.target_id, s.community FROM edges e JOIN nodes s ON s.id=e.source_id JOIN nodes t ON t.id=e.target_id ORDER BY 1');
    log(out, '\n② 图游走 + 社区列:\n' + graph.map(r => `   ${r[0]} -${r[1]}-> ${r[2]}   [社区 ${r[3]}]`).join('\n'), 'ok');

    const comm = await q('SELECT community, count(*) FROM nodes GROUP BY community ORDER BY community');
    log(out, '\n③ 社区统计(Leiden 离线标签):\n' + comm.map(r => `   社区${r[0]}: ${r[1]} 节点`).join('\n'), 'ok');

    const ev = await q('SELECT e.target_id, n.entity, unnest(e.chunk_ids) cid FROM edges e JOIN nodes n ON n.id=e.target_id ORDER BY 1,3');
    log(out, '\n④ 证据回溯(节点->chunk):\n' + ev.map(r => `   ${r[0]} (${r[1]}) -> ${r[2]}`).join('\n'), 'ok');

    const meta = await q("SELECT key || ' = ' || value FROM meta ORDER BY key");
    log(out, '\n⑤ 包内 meta(自描述):\n' + meta.map(r => '   ' + r[0]).join('\n'), 'ok');
    log(out, `\n静态链完成 ${(performance.now()-t0).toFixed(0)}ms —— 零模型, 零服务端, 数据源就是那个 .duckdb 文件。`, 'ok');
  } catch (e) { log(out, '\n静态链 FAIL: ' + e.message, 'err'); }
}
document.getElementById('go').onclick = runStatic;

// ---------- ② 动态层: JEV(查询期 LLM 裁判) ----------
const JEVOUT = document.getElementById('jevout');
let judgeCalls = 0;

async function judge(question, candidate) {
  judgeCalls++;
  const r = await fetch('/jev', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'qwen3.8-27b',
      messages: [
        { role: 'user', content: `你是证据裁判。判断下面的候选段落是否是回答问题的【必需证据】。\n问题: ${question}\n候选段落: ${candidate}\n只回答 0(否)或 1(是)。` },
      ],
    }),
  });
  if (!r.ok) throw new Error(`/jev HTTP ${r.status} (Pages/静态部署无代理, 预期内)`);
  const j = await r.json();
  const c = (j.choices?.[0]?.message?.content || '').trim();
  return c === '1' ? 1 : 0;
}

// 从判 1 的种子段抽扩展词(简化版 SAG2 TF-IDF: 词频 top, 去停用词)
function expandWords(texts, k = 3) {
  const stop = new Set(['the','and','for','with','use','uses','using','is','a','an','of','to','in','on','by','that','which','improve','provides','inside','supports']);
  const freq = new Map();
  for (const t of texts) {
    for (const w of t.toLowerCase().match(/[a-z]{3,}/g) || []) {
      if (!stop.has(w)) freq.set(w, (freq.get(w) || 0) + 1);
    }
  }
  return [...freq.entries()].sort((a, b) => b[1] - a[1]).slice(0, k).map(([w]) => w);
}

async function runJEV() {
  const question = document.getElementById('question').value.trim();
  if (!dbReady) return log(JEVOUT, '请先载入 .duckdb 文件', 'err');
  JEVOUT.innerHTML = '';
  judgeCalls = 0;
  const t0 = performance.now();
  try {
    // 种子 = 静态向量 top3
    const seed = await q(`
      WITH q AS (SELECT [0.85, 0.15, 0.0, 0.15]::FLOAT[4] v),
      parts AS (SELECT c.id, c.text,
               (SELECT sum((q.v[i] - c.embedding[i]) * (q.v[i] - c.embedding[i])) FROM unnest(range(0,4)) t(i)) d2
        FROM chunks c, q)
      SELECT id, text FROM parts ORDER BY d2 LIMIT 3`);
    log(JEVOUT, `问题: ${question}\n种子(静态向量 top3): ${seed.map(r => r[0]).join(', ')}\n`, 'ok');

    // 首跳: 逐候选判分
    const seen = new Set();
    const hits = [];
    for (const [id, text] of seed) { seen.add(id); hits.push({ id, text, jev: await judge(question, text) }); }
    log(JEVOUT, `首跳判分: ` + hits.map(h => `${h.id}=${h.jev}`).join('  '), 'ok');

    // 二跳: 从 jev=1 的段抽扩展词, 词法再搜(1.x 无 tantivy -> SQL LIKE 近似, 玩具库规模下等价), 对新段判分
    const pos = hits.filter(h => h.jev === 1).map(h => h.text);
    let hop2 = '';
    if (pos.length) {
      const words = expandWords(pos);
      const cond = words.map(w => `lower(text) LIKE '%${w}%'`).join(' OR ');
      const cand = await q(`SELECT id, text FROM chunks WHERE id NOT IN (${[...seen].map(x => `'${x}'`).join(',')}) AND (${cond})`);
      if (cand.length) {
        for (const [id, text] of cand) {
          seen.add(id);
          const j = await judge(question, text);
          if (j) hits.push({ id, text, jev: 1, hop2: true });
          hop2 += `\n二跳 ${id}(${words.join('/')}): jev=${j}\n`;
        }
      }
      log(JEVOUT, `扩展词: ${words.join(', ')}\n${hop2 || '(无新候选)'}`, 'ok');
    }

    // 终排: jev=1 在前
    const ranked = hits.filter(h => h.jev === 1).sort((a, b) => (a.hop2 ? 1 : 0) - (b.hop2 ? 1 : 0));
    log(JEVOUT, `\nJEV 终排(必需证据):\n` + (ranked.length ? ranked.map(h => `   ${h.id}${h.hop2 ? '(二跳找回)' : ''}  ${String(h.text).slice(0, 52)}`).join('\n') : '   (无)') +
      `\n\n调用 ${judgeCalls} 次, ${(performance.now()-t0).toFixed(0)}ms —— 端点可达: 动态层生效。`, 'ok');
  } catch (e) {
    log(JEVOUT, `\nDEGRADED: JEV 端点不可达(${e.message}), 自动降级纯静态链。调用 ${judgeCalls} 次。`, 'warn');
  }
}
const isLocalHost = /(^localhost$)|(^127\.0\.0\.1$)/.test(location.hostname);
document.getElementById('jevgo').onclick = () => {
  if (!isLocalHost) {
    JEVOUT.innerHTML = '';
    log(JEVOUT, '此部署(静态 / GitHub Pages)无同源 /jev 代理 → JEV 动态层不可用, 自动降级纯静态链(设计内)。本机 node launcher.mjs → :8210 可跑完整两层。', 'warn');
    return;
  }
  runJEV();
};

// 页面加载即演示
document.getElementById('autoload').onclick();
</script>
</body>
</html>
